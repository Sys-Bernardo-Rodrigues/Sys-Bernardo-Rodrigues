<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Dopa do Tereré, desenvolvedor full-stack">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B3D1A"/><stop offset=".55" stop-color="#1B5E20"/><stop offset="1" stop-color="#4E8F2A"/></linearGradient>
<radialGradient id="glow" cx=".78" cy=".2" r=".7"><stop offset="0" stop-color="#C5E1A5" stop-opacity=".35"/><stop offset="1" stop-color="#C5E1A5" stop-opacity="0"/></radialGradient>
<g id="leaf"><path d="M0 -22 C 15 -12, 15 12, 0 26 C -15 12, -15 -12, 0 -22 Z"/><path d="M0 -20 L0 30 M0 -6 L8 -14 M0 4 L-9 -4 M0 12 L8 4" stroke="#0B3D1A" stroke-opacity=".45" stroke-width="1.2" fill="none" stroke-linecap="round"/></g>
<style>
.fall{animation:fall linear infinite}
.sway{animation:sway ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes fall{from{transform:translateY(-50px)}to{transform:translateY(340px)}}
@keyframes sway{from{transform:translateX(calc(var(--a) * -1)) rotate(calc(var(--r) * -.4))}to{transform:translateX(var(--a)) rotate(var(--r))}}
.title{font:800 58px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#fff;animation:rise 1.2s ease-out both}
.sub{font:500 19px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#DCEDC8;animation:rise 1.2s .25s ease-out both}
.tag{font:600 15px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#F1F8E9;animation:rise 1.2s .5s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.steam{animation:steam 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes steam{0%,100%{opacity:.15;transform:translateY(0) scaleY(1)}50%{opacity:.45;transform:translateY(-8px) scaleY(1.15)}}
@media (prefers-reduced-motion:reduce){.fall,.sway,.steam{animation:none}}
</style>
