<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="900" height="64" role="img" aria-label="Projetos em destaque">
<defs><linearGradient id="p" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B3D1A"/><stop offset="1" stop-color="#4E8F2A"/></linearGradient><linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7CB342"/><stop offset="1" stop-color="#7CB342" stop-opacity="0"/></linearGradient><g id="leaf"><path d="M0 -22 C 15 -12, 15 12, 0 26 C -15 12, -15 -12, 0 -22 Z"/><path d="M0 -20 L0 30 M0 -6 L8 -14 M0 4 L-9 -4 M0 12 L8 4" stroke="#0B3D1A" stroke-opacity=".45" stroke-width="1.2" fill="none" stroke-linecap="round"/></g><style>.t{font:800 26px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#fff;animation:slide .9s ease-out both}@keyframes slide{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}.pill{animation:grow .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:left center}@keyframes grow{from{transform:scaleX(.2);opacity:0}to{transform:none;opacity:1}}.ic{animation:wob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wob{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}.line{stroke-dasharray:820;animation:draw 5s ease-in-out infinite}@keyframes draw{0%{stroke-dashoffset:820}45%,75%{stroke-dashoffset:0}100%{stroke-dashoffset:-820}}.dot{animation:run 5s ease-in-out infinite}@keyframes run{0%{transform:translateX(0);opacity:0}10%{opacity:1}45%{opacity:1}100%{transform:translateX(468px);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
